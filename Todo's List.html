
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TODO List</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
    <div class="container mt-4">

        <h1 class="text-center mb-4">TODO'S List</h1>

        <!-- Task Input -->
        <div class="mb-3">
            <label for="title" class="form-label">Enter Your Task</label>
            <input type="text" class="form-control" id="title"
                placeholder="Enter task title">
            <div class="form-text">Add an item to your list.</div>
        </div>

        <!-- Description -->
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description"
                rows="3" placeholder="Enter task description"></textarea>
        </div>

        <!-- Add Button -->
        <button type="button" id="add" class="btn btn-primary mb-4">
            Add To List
        </button>

        <!-- Task Table -->
        <h2>Your Items</h2>

        <div class="table-responsive">
            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th scope="col">S.No</th>
                        <th scope="col">Item Title</th>
                        <th scope="col">Item Description</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>

                <!-- JavaScript populates this tbody -->
                <tbody id="tableBody"></tbody>
            </table>
        </div>

    </div>

    <!-- JavaScript  -->
    <script>
        let add = document.getElementById("add");

        let itemJsonArray = JSON.parse(
            localStorage.getItem("itemsJson") || "[]"
        );

        let tableBody = document.getElementById("tableBody");

        // Display saved tasks
        function updateTable() {
            let str = "";

            itemJsonArray.forEach((element, index) => {
                str += `
                    <tr>
                        <th scope="row">${index + 1}</th>
                        <td></td>
                        <td></td>
                        <td>
                            <button class="btn btn-sm btn-danger"
                                onclick="deleteItem(${index})">
                                Delete
                            </button>
                        </td>
                    </tr>`;
            });

            tableBody.innerHTML = str;

            // Insert text safely into the table
            itemJsonArray.forEach((element, index) => {
                tableBody.rows[index].cells[1].textContent = element[0];
                tableBody.rows[index].cells[2].textContent = element[1];
            });
        }

        // Add task
        add.addEventListener("click", () => {
            let tit = document.getElementById("title").value.trim();
            let desc = document.getElementById("description").value.trim();

            if (tit === "") {
                alert("Please enter a task title!");
                return;
            }

            itemJsonArray.push([tit, desc]);

            localStorage.setItem(
                "itemsJson",
                JSON.stringify(itemJsonArray)
            );

            document.getElementById("title").value = "";
            document.getElementById("description").value = "";

            updateTable();
        });

        // Delete task
        function deleteItem(index) {
            itemJsonArray.splice(index, 1);

            localStorage.setItem(
                "itemsJson",
                JSON.stringify(itemJsonArray)
            );

            updateTable();
        }

        // Load saved tasks on page opening
        updateTable();
    </script>

</body>
</html>
